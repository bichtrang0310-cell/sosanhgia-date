<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Receiving</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .preview-img { max-height: 380px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">

  <div class="bg-blue-700 text-white p-4 fixed top-0 w-full z-50 shadow-md">
    <h1 class="text-xl font-bold text-center">Smart Receiving</h1>
    <p class="text-center text-sm opacity-90">PO + Hóa đơn + Date</p>
  </div>

  <div class="pt-20 px-4 max-w-lg mx-auto">

    <!-- HOME -->
    <div id="home" class="screen active">
      <div class="text-center py-8">
        <h2 class="text-2xl font-bold text-gray-800">Nhận hàng thông minh</h2>
      </div>
      <div class="space-y-4">
        <button onclick="showScreen('po')" class="w-full bg-green-600 text-white py-7 rounded-3xl text-lg font-semibold">1. Chụp Đơn PO</button>
        <button onclick="showScreen('invoice')" class="w-full bg-orange-600 text-white py-7 rounded-3xl text-lg font-semibold">2. Chụp Hóa Đơn Đỏ</button>
        <button onclick="showScreen('date')" class="w-full bg-purple-600 text-white py-7 rounded-3xl text-lg font-semibold">3. Kiểm tra % Date</button>
      </div>
    </div>

    <!-- PO SCREEN -->
    <div id="po" class="screen">
      <h3 class="font-bold mb-4 text-lg">📸 Chụp Đơn Đặt Hàng (PO)</h3>
      <input type="file" id="po-input" accept="image/*" capture="environment" class="hidden" onchange="processPO(this)">
      <button onclick="document.getElementById('po-input').click()" class="w-full bg-green-600 text-white py-12 rounded-2xl flex flex-col items-center gap-3">
        <i class="fa-solid fa-camera text-5xl"></i>
        <span>Chụp ảnh Đơn PO</span>
      </button>
      <div id="po-preview" class="hidden mt-4">
        <img id="po-img" class="preview-img w-full">
      </div>
      <button onclick="confirmPO()" class="mt-6 w-full bg-green-700 text-white py-4 rounded-2xl font-bold">Xác nhận PO</button>
      <button onclick="showScreen('home')" class="mt-4 text-gray-500">← Quay lại</button>
    </div>

    <!-- INVOICE SCREEN -->
    <div id="invoice" class="screen">
      <h3 class="font-bold mb-4 text-lg">📸 Chụp Hóa Đơn Đỏ</h3>
      <input type="file" id="invoice-input" accept="image/*" capture="environment" class="hidden" onchange="processInvoice(this)">
      <button onclick="document.getElementById('invoice-input').click()" class="w-full bg-orange-600 text-white py-12 rounded-2xl flex flex-col items-center gap-3">
        <i class="fa-solid fa-camera text-5xl"></i>
        <span>Chụp Hóa Đơn Đỏ</span>
      </button>
      <div id="invoice-preview" class="hidden mt-4">
        <img id="invoice-img" class="preview-img w-full">
      </div>
      <button onclick="startInvoiceOCR()" class="mt-6 w-full bg-orange-700 text-white py-4 rounded-2xl font-bold">Xử lý OCR & So sánh</button>
      <button onclick="showScreen('home')" class="mt-4 text-gray-500">← Quay lại</button>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result" class="screen">
      <h3 class="font-bold mb-3">Kết quả So sánh PO vs Hóa đơn</h3>
      <div class="bg-white rounded-2xl shadow overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="py-3 px-3 text-left">Sản phẩm</th>
              <th class="py-3 px-3 text-center">Giá PO</th>
              <th class="py-3 px-3 text-center">Giá HĐ</th>
              <th class="py-3 px-3 text-center">Chênh lệch</th>
              <th class="py-3 px-3 text-center">Trạng thái</th>
            </tr>
          </thead>
          <tbody id="result-table" class="divide-y"></tbody>
        </table>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="approveReceipt()" class="flex-1 bg-green-600 text-white py-5 rounded-2xl font-bold">✅ Duyệt Nhận Hàng</button>
        <button onclick="reportIssue()" class="flex-1 bg-red-600 text-white py-5 rounded-2xl font-bold">❌ Báo Sai</button>
      </div>
      <button onclick="showScreen('home')" class="mt-6 text-gray-500">← Về trang chủ</button>
    </div>

    <!-- DATE SCREEN -->
    <div id="date" class="screen">
      <h3 class="font-bold mb-4">Kiểm tra % Date còn lại</h3>
      <div class="bg-white p-6 rounded-2xl shadow">
        <input type="text" id="prod-name" placeholder="Tên sản phẩm" class="w-full border rounded-xl px-4 py-3 mb-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm mb-1">Ngày sản xuất</label>
            <input type="date" id="nsx" class="w-full border rounded-xl px-4 py-3">
          </div>
          <div>
            <label class="block text-sm mb-1">Hạn sử dụng</label>
            <input type="date" id="hsd" class="w-full border rounded-xl px-4 py-3">
          </div>
        </div>
        <button onclick="calculateDatePercent()" class="mt-6 w-full bg-purple-600 text-white py-4 rounded-2xl font-bold">Tính % Date</button>
      </div>
      <div id="date-result" class="hidden mt-6 p-6 bg-white rounded-2xl shadow text-center"></div>
      <button onclick="showScreen('home')" class="mt-6 text-gray-500">← Quay lại</button>
    </div>
  </div>

  <script>
    let poItems = [];
    let invoiceItems = [];

    function showScreen(screenName) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      const target = document.getElementById(screenName);
      if (target) target.classList.add('active');
    }

    // PO
    function processPO(input) {
      handleImage(input, 'po');
    }

    async function confirmPO() {
      if (!document.getElementById('po-img').src || document.getElementById('po-img').src === "") {
        return alert("Vui lòng chụp ảnh Đơn PO trước!");
      }
      alert("✅ PO đã được lưu (Demo - OCR sẽ chạy khi bạn chụp thật)");
      poItems = [{ name: "Phomai hun khói 200g Solse", pricePO: 88350 }];
      showScreen('invoice');
    }

    // Hóa đơn
    function processInvoice(input) {
      handleImage(input, 'invoice');
    }

    async function startInvoiceOCR() {
      if (!document.getElementById('invoice-img').src || document.getElementById('invoice-img').src === "") {
        return alert("Vui lòng chụp Hóa đơn trước!");
      }
      alert("Đang xử lý OCR...");
      invoiceItems = [
        { name: "Phomai hun khói 200g Solse", priceHD: 88350 },
        { name: "Phomai hun khói dê sợi 100g Solse", priceHD: 55100 }
      ];
      showComparison();
    }

    function handleImage(input, type) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgId = type === 'po' ? 'po-img' : 'invoice-img';
          const previewId = type === 'po' ? 'po-preview' : 'invoice-preview';
          document.getElementById(imgId).src = e.target.result;
          document.getElementById(previewId).classList.remove('hidden');
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function showComparison() {
      const tbody = document.getElementById('result-table');
      tbody.innerHTML = '';

      invoiceItems.forEach(item => {
        const po = poItems[0] || {pricePO: 0};
        const diff = item.priceHD - po.pricePO;

        const row = `
          <tr class="border-t">
            <td class="py-4 px-3">${item.name}</td>
            <td class="py-4 px-3 text-center">${po.pricePO.toLocaleString('vi-VN')}</td>
            <td class="py-4 px-3 text-center">${item.priceHD.toLocaleString('vi-VN')}</td>
            <td class="py-4 px-3 text-center ${diff > 0 ? 'text-red-600' : 'text-green-600'}">
              ${diff > 0 ? '+' : ''}${diff.toLocaleString('vi-VN')}
            </td>
            <td class="py-4 px-3 text-center ${diff <= 1000 ? 'text-green-600' : 'text-red-600'}">
              ${diff <= 1000 ? '✅ Hợp lệ' : '⚠️ Chênh lệch'}
            </td>
          </tr>`;
        tbody.innerHTML += row;
      });

      showScreen('result');
    }

    // Date Check
    function calculateDatePercent() {
      const nsx = document.getElementById('nsx').value;
      const hsd = document.getElementById('hsd').value;

      if (!nsx || !hsd) return alert("Vui lòng nhập ngày sản xuất và hạn sử dụng!");

      const dateNSX = new Date(nsx);
      const dateHSD = new Date(hsd);
      const today = new Date();

      const total = (dateHSD - dateNSX) / (86400000);
      const remain = (dateHSD - today) / (86400000);
      let percent = total > 0 ? Math.round((remain / total) * 100) : 0;
      percent = Math.max(0, Math.min(100, percent));

      const color = percent > 80 ? 'text-green-600' : (percent >= 50 ? 'text-yellow-600' : 'text-red-600');
      const status = percent > 80 ? 'RẤT TỐT' : (percent >= 50 ? 'CHẤP NHẬN ĐƯỢC' : 'CẬN DATE - CẢNH BÁO');

      document.getElementById('date-result').innerHTML = `
        <p class="text-6xl font-bold ${color}">${percent}%</p>
        <p class="mt-3 text-xl font-semibold">${status}</p>
        <p class="text-sm text-gray-500 mt-2">Còn ${Math.max(0, Math.round(remain))} ngày</p>
      `;
      document.getElementById('date-result').classList.remove('hidden');
    }

    function approveReceipt() { alert("✅ Đã duyệt nhận hàng thành công!"); showScreen('home'); }
    function reportIssue() { alert("📤 Báo cáo sai lệch đã được gửi."); showScreen('home'); }

    // Khởi tạo
    console.log("🚀 Smart Receiving App đã khởi động thành công!");
  </script>
</body>
</html>
