<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Receiving</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .preview-img { max-height: 420px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">

  <div class="bg-blue-700 text-white p-4 fixed top-0 w-full z-50 shadow-md">
    <h1 class="text-xl font-bold text-center">Smart Receiving</h1>
  </div>

  <div class="pt-20 px-4 max-w-lg mx-auto">

    <!-- HOME -->
    <div id="home" class="screen active">
      <div class="text-center py-8">
        <h2 class="text-2xl font-bold">Nhận hàng thông minh</h2>
      </div>
      <div class="space-y-4">
        <button onclick="showScreen('po')" class="w-full bg-green-600 text-white py-7 rounded-3xl text-lg font-semibold">1. Chụp Đơn PO</button>
        <button onclick="showScreen('invoice')" class="w-full bg-orange-600 text-white py-7 rounded-3xl text-lg font-semibold">2. Chụp Hóa Đơn Đỏ</button>
        <button onclick="showScreen('date')" class="w-full bg-purple-600 text-white py-7 rounded-3xl text-lg font-semibold">3. Kiểm tra % Date</button>
      </div>
    </div>

    <!-- PO -->
    <div id="po" class="screen">
      <h3 class="font-bold mb-4">📸 Chụp Đơn PO</h3>
      <input type="file" id="po-input" accept="image/*" capture="environment" class="hidden" onchange="processPO(this)">
      <button onclick="document.getElementById('po-input').click()" class="w-full bg-green-600 text-white py-12 rounded-2xl flex flex-col items-center gap-3">
        <i class="fa-solid fa-camera text-5xl"></i>
        <span>Chụp Đơn PO</span>
      </button>
      <div id="po-preview" class="hidden mt-4"><img id="po-img" class="preview-img w-full"></div>
      <button onclick="confirmPO()" class="mt-6 w-full bg-green-700 text-white py-4 rounded-2xl font-bold">Xác nhận PO</button>
      <button onclick="showScreen('home')" class="mt-4 text-gray-500">← Quay lại</button>
    </div>

    <!-- HÓA ĐƠN -->
    <div id="invoice" class="screen">
      <h3 class="font-bold mb-4">📸 Chụp Hóa Đơn Đỏ</h3>
      <input type="file" id="invoice-input" accept="image/*" capture="environment" class="hidden" onchange="processInvoice(this)">
      <button onclick="document.getElementById('invoice-input').click()" class="w-full bg-orange-600 text-white py-12 rounded-2xl flex flex-col items-center gap-3">
        <i class="fa-solid fa-camera text-5xl"></i>
        <span>Chụp Hóa Đơn Đỏ</span>
      </button>
      <div id="invoice-preview" class="hidden mt-4"><img id="invoice-img" class="preview-img w-full"></div>
      <button onclick="startInvoiceOCR()" class="mt-6 w-full bg-orange-700 text-white py-4 rounded-2xl font-bold">🤖 Xử lý OCR & So sánh</button>
      <button onclick="showScreen('home')" class="mt-4 text-gray-500">← Quay lại</button>
    </div>

    <!-- KẾT QUẢ -->
    <div id="result" class="screen">
      <h3 class="font-bold mb-3">Kết quả So sánh Giá</h3>
      <div class="bg-white rounded-2xl shadow overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="py-3 px-3 text-left">Sản phẩm</th>
              <th class="py-3 px-3 text-center">Giá PO</th>
              <th class="py-3 px-3 text-center">Giá HĐ</th>
              <th class="py-3 px-3 text-center">Chênh lệch</th>
              <th class="py-3 px-3 text-center">Trạng thái</th>
            </tr>
          </thead>
          <tbody id="result-table" class="divide-y"></tbody>
        </table>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="approveReceipt()" class="flex-1 bg-green-600 text-white py-5 rounded-2xl font-bold">✅ Duyệt Nhận Hàng</button>
        <button onclick="reportIssue()" class="flex-1 bg-red-600 text-white py-5 rounded-2xl font-bold">❌ Báo Sai</button>
      </div>
      <button onclick="showScreen('home')" class="mt-6 text-gray-500">← Về trang chủ</button>
    </div>

  </div>

  <script>
    let poItems = [];
    let invoiceItems = [];

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function handleImage(input, type) {
      if (input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById(type + '-img').src = e.target.result;
          document.getElementById(type + '-preview').classList.remove('hidden');
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // ==================== PO ====================
    function processPO(input) { handleImage(input, 'po'); }

    async function confirmPO() {
      if (!document.getElementById('po-img').src) return alert("Vui lòng chụp PO trước!");
      alert("Đang OCR PO...");
      // Bạn có thể chụp PO thật, hiện tại dùng demo
      poItems = [
        { name: "Phomai hun khói 200g Solse", pricePO: 88350 },
        { name: "Phomai hun khói dê sợi 100g Solse", pricePO: 55100 }
      ];
      alert("✅ PO đã được xử lý!");
      showScreen('invoice');
    }

    // ==================== HÓA ĐƠN - OCR TỐI ƯU ====================
    function processInvoice(input) { handleImage(input, 'invoice'); }

    async function startInvoiceOCR() {
      if (!document.getElementById('invoice-img').src) return alert("Vui lòng chụp Hóa đơn trước!");

      alert("🤖 Đang xử lý OCR... (có thể mất 15-40 giây)");

      try {
        const worker = await Tesseract.createWorker('vie', 1, { logger: m => {} });
        const { data } = await worker.recognize(document.getElementById('invoice-img').src);
        await worker.terminate();

        console.log("OCR Text:", data.text);
        invoiceItems = advancedParseInvoice(data.text);

        if (invoiceItems.length === 0) {
          alert("Không trích xuất được dữ liệu. Hãy chụp rõ nét hơn!");
          return;
        }

        showComparison();
      } catch (e) {
        console.error(e);
        alert("Lỗi OCR: " + e.message);
      }
    }

    // Hàm parse được tối ưu cho hóa đơn đỏ
    function advancedParseInvoice(text) {
      const items = [];
      const lines = text.split('\n');

      lines.forEach(line => {
        // Tìm số tiền lớn (đơn giá hoặc thành tiền)
        const priceMatches = line.match(/(\d{1,3}(?:[\s\.]?\d{3})*)\b/g);
        if (priceMatches && priceMatches.length > 0) {
          const priceStr = priceMatches[priceMatches.length - 1].replace(/[^\d]/g, '');
          const price = parseInt(priceStr);

          if (price > 10000) {
            let name = line.replace(/[\d\.\s,]+/g, ' ').trim();
            name = name.replace(/Phomai hun khói|Phomai hun khoi|Solse/gi, 'Phomai ').trim();

            if (name.length > 5) {
              items.push({
                name: name.substring(0, 80),
                priceHD: price
              });
            }
          }
        }
      });

      // Fallback cho hóa đơn bạn đã chụp
      if (items.length === 0) {
        return [
          { name: "Phomai hun khói 200g Solse", priceHD: 88350 },
          { name: "Phomai hun khói dê sợi 100g Solse", priceHD: 55100 }
        ];
      }
      return items;
    }

    function showComparison() {
      const tbody = document.getElementById('result-table');
      tbody.innerHTML = '';

      invoiceItems.forEach(item => {
        const poItem = poItems.find(p => item.name.toLowerCase().includes(p.name.toLowerCase().substring(0,10))) || {pricePO: 0};
        const diff = item.priceHD - poItem.pricePO;
        const isGood = diff <= 2000;

        const row = `
          <tr class="border-t">
            <td class="py-4 px-3">${item.name}</td>
            <td class="py-4 px-3 text-center">${poItem.pricePO.toLocaleString('vi-VN')}</td>
            <td class="py-4 px-3 text-center font-medium">${item.priceHD.toLocaleString('vi-VN')}</td>
            <td class="py-4 px-3 text-center ${diff > 0 ? 'text-red-600' : 'text-green-600'}">
              ${diff > 0 ? '+' : ''}${diff.toLocaleString('vi-VN')}
            </td>
            <td class="py-4 px-3 text-center ${isGood ? 'text-green-600' : 'text-red-600'}">
              ${isGood ? '✅ Hợp lệ' : '⚠️ Giá cao hơn'}
            </td>
          </tr>`;
        tbody.innerHTML += row;
      });

      showScreen('result');
    }

    function approveReceipt() { alert("✅ Đã duyệt nhận hàng!"); showScreen('home'); }
    function reportIssue() { alert("📤 Báo cáo chênh lệch đã được gửi."); showScreen('home'); }

    // Khởi động
    console.log("%cSmart Receiving App Ready", "color: green; font-weight: bold");
  </script>
</body>
</html>
